aid: materna-medical
name: Materna Medical
description: 'Materna Medical is a Mountain View, California women''s health medical
  device company building an OBGYN platform around pelvic floor health. Its first
  product, Milli, is an expanding vaginal dilator that widens one millimeter at a time
  with optional vibration, sold direct-to-consumer and through OBGYN and pelvic floor
  physical therapy practices for vaginismus, dyspareunia, postpartum recovery and
  menopause-related painful sex; it launched as a wellness trainer in 2019 and received
  FDA over-the-counter clearance in 2023. Its second product, Ellora, is an investigational
  device used during labor to reduce pelvic floor muscle injury in vaginal delivery,
  studied in the randomized EASE trial across US hospitals and assigned a new ICD-10-PCS
  technology code effective April 2026. Materna Medical sells regulated physical devices
  and clinical evidence, not software: it operates a WordPress marketing site
  (maternamedical.com) and a WooCommerce consumer storefront (hellomilli.com), publishes
  no developer program, no public API, no SDK and no machine-readable API contract, and
  runs no api., developer., docs. or app. subdomain.'
